      # no cambia entre glosas: recalcularlos en cada una era pedir decenas de
      # vectores para aprovechar uno. `0` desactiva la caché.
      SEMANTIC_TRANSFORMER_PROBE_CACHE_SIZE:
      # Memoria de glosas ya clasificadas. Su clave incluye la firma del
      # catálogo, así que publicar una categoría invalida lo afectado sola.
      SEMANTIC_ANALYSIS_CLASSIFICATION_TTL_SECONDS:
      SEMANTIC_ANALYSIS_CLASSIFICATION_CACHE:
      # Prefijos y umbrales son propiedades DEL MODELO servido, no de este
      # despliegue: al cambiar de modelo hay que volver a medirlos.
      SEMANTIC_TRANSFORMER_QUERY_PREFIX:
      SEMANTIC_TRANSFORMER_PASSAGE_PREFIX:
      SEMANTIC_TRANSFORMER_SIMILARITY_FLOOR:
      SEMANTIC_TRANSFORMER_TEMPERATURE:
      SEMANTIC_TRANSFORMER_CONTRADICTION_MARGIN:
      SEMANTIC_ANALYSIS_WORKER_CONCURRENCY:
      # Cuántas categorías se le proponen al clasificador. Cada candidato añade
      # sus sondas al lote de embeddings; con un codificador el coste es lineal y
      # barato, así que aquí cabe más recall que con un modelo generativo.
      SEMANTIC_ANALYSIS_CANDIDATE_LIMIT:
