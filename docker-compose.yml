      # Proveedor generativo alternativo (SEMANTIC_ANALYSIS_PROVIDER=openai). El
      # presupuesto y el lease se derivan de estos: el puente exige
      # `timeout × intentos × 2 tiers ≤ presupuesto` y los eleva solo.
      SEMANTIC_FAST_MODEL:
      SEMANTIC_DEEP_MODEL:
      SEMANTIC_PROVIDER_TIMEOUT_MS:
      SEMANTIC_PROVIDER_MAX_ATTEMPTS:
      SEMANTIC_PROVIDER_MAX_OUTPUT_TOKENS:
      OPENAI_BASE_URL:
      OPENAI_API_KEY:
