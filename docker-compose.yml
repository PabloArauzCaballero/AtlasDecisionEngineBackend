name: atlas-decision-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_decision}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_decision}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - atlas_decision_pg:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - atlas_decision_redis:/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas-local-only}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
    command: ["migrate", "deploy"]
    restart: "no"

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: migrator
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas-local-only}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-local-management-key-change-before-sharing}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:-local-runtime-key-change-before-sharing}
      BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-1}
      BOOTSTRAP_MANAGEMENT_ROLES: ${BOOTSTRAP_MANAGEMENT_ROLES:-AUDITOR,COMPLIANCE,FRAUD_ANALYST,OPERATIONS,PLATFORM_ADMIN,QA_ANALYST,RISK_ANALYST,RISK_APPROVER}
      BOOTSTRAP_RUNTIME_ROLES: ${BOOTSTRAP_RUNTIME_ROLES:-DECISION_RUNTIME}
    command: ["db", "seed"]
    restart: "no"

  # Isolated sidecar that executes untrusted RESULT-node scripts (JS/Python) out of process
  # from the API. Network-less (network_mode: none), capability-dropped, read-only and
  # resource-capped; the api reaches it only through a Unix socket on a shared volume, never
  # over the network. See docs/CONFIGURABLE_OUTPUTS.md for the gVisor host setup this requires.
  script-runner:
    build:
      context: .
      target: script-runner
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Requires gVisor installed on the Docker host and registered as the `runsc` runtime
    # (docs/CONFIGURABLE_OUTPUTS.md). Only remove this on a host without gVisor for local
    # development — never in production, since runc alone is not an OS security boundary.
    runtime: runsc
    network_mode: none
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.5"
    environment:
      RUNNER_SOCKET_PATH: /var/run/atlas-runner/runner.sock
    volumes:
      - atlas_runner_socket:/var/run/atlas-runner
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      script-runner:
        condition: service_started
    environment:
      NODE_ENV: development
      BUILD_VERSION: ${BUILD_VERSION:-2.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-local-compose}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas-local-only}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_MODE: API_KEY
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-local-management-key-change-before-sharing}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:-local-runtime-key-change-before-sharing}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:-local-audit-hash-secret-must-be-at-least-32-characters}
      METRICS_TOKEN: ${METRICS_TOKEN:-local-metrics-token-change-before-sharing}
      REQUIRE_REDIS_IN_PRODUCTION: "true"
      SWAGGER_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:5173}
      SCRIPT_NODES_ENABLED: ${SCRIPT_NODES_ENABLED:-false}
      SCRIPT_RUNNER_MODE: SIDECAR
      SCRIPT_RUNNER_SOCKET_PATH: /var/run/atlas-runner/runner.sock
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 25s
    restart: unless-stopped
    volumes:
      - atlas_runner_socket:/var/run/atlas-runner:ro

volumes:
  atlas_decision_pg:
  atlas_decision_redis:
  atlas_runner_socket:
