      # Gateway LiteLLM (SEMANTIC_ANALYSIS_PROVIDER=litellm). El motor pide ALIAS
      # LÓGICOS y sólo conoce la credencial del gateway; qué modelo físico los
      # atiende vive en `infra/litellm/config.yaml`, junto con las claves de los
      # proveedores. `litellm:4000` es el nombre de servicio de esta red: con
      # `localhost` el contenedor se buscaría a sí mismo.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_FAST_MODEL:
      LITELLM_DEEP_MODEL:
      LITELLM_EMBEDDING_MODEL:
      LITELLM_TIMEOUT_MS:
      LITELLM_MAX_ATTEMPTS:
      LITELLM_MAX_OUTPUT_TOKENS:
      # Cuánto se le espera al codificador local antes de escalar al LLM
      # (SEMANTIC_ANALYSIS_PROVIDER=cascade).
      SEMANTIC_CASCADE_LOCAL_TIMEOUT_MS:
      WORKERS_FIXTURES_ENABLED: ${WORKERS_FIXTURES_ENABLED:-true}
      # Orquestación de trabajos. El despertar por LISTEN/NOTIFY llega directo a Postgres
      # (sin pgbouncer de por medio en esta topología), así que el techo de sondeo puede ser
      # alto sin coste de latencia: al ralentí el worker consulta cada 30 s en vez de cada
      # segundo, y una escritura de la API lo despierta en el commit.
      JOB_SCHEDULER_ENABLED: ${JOB_SCHEDULER_ENABLED:-true}
      JOB_WAKE_ENABLED: ${JOB_WAKE_ENABLED:-true}
      JOB_MAX_IDLE_INTERVAL_MS: ${JOB_MAX_IDLE_INTERVAL_MS:-30000}
      # Trazas. Apagadas por defecto: se encienden con `yarn jaeger:up` y OTEL_ENABLED=true en
      # el .env. El nombre de servicio es DISTINTO del de la API — compartirlo dejaría el grafo
      # de dependencias de Jaeger con un solo nodo hablando consigo mismo. El destino usa el
      # nombre de servicio `jaeger`, no localhost: dentro del contenedor localhost es él mismo.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      # Ejecución de scripts: los MISMOS valores que la API, porque ejecuta los mismos
      # grafos. Que sólo los tuviera la API era la asimetría que rompía las corridas.
      SCRIPT_NODES_ENABLED: ${SCRIPT_NODES_ENABLED:-false}
      SCRIPT_RUNNER_MODE: SIDECAR
      SCRIPT_RUNNER_SOCKET_PATH: /var/run/atlas-runner/runner.sock
      SCRIPT_NODE_MAX_MEMORY_MB: ${SCRIPT_NODE_MAX_MEMORY_MB:-64}
      # Tope por ejecución de script. El valor del producto (250 ms) mide bien un script ya
      # en marcha, pero NO cubre el arranque en frío del intérprete a través del socket del
      # sidecar: la primera ejecución tras levantar un contenedor lo excedía y devolvía
      # `SCRIPT_EXECUTION_FAILED` en una corrida que a la segunda pasaba. Aquí se afloja
      # sólo para la topología en contenedor; el motor conserva su cota, muy por debajo del
      # máximo que admite el esquema de entorno.
      SCRIPT_NODE_TIMEOUT_MS: ${SCRIPT_NODE_TIMEOUT_MS:-1500}
      OTEL_SERVICE_NAME: atlas-worker
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-atlas}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    # Más margen que la API: un lote de casos de prueba en vuelo tarda más en drenar que una
    # petición HTTP, y matarlo a mitad devuelve la corrida a la cola por lease vencido.
    stop_grace_period: 60s
    networks: [atlas_app, atlas_data]
    cpus: ${WORKER_CPUS:-1}
    mem_limit: ${WORKER_MEMORY:-768m}
    restart: unless-stopped
    volumes:
      - atlas_runner_socket:/var/run/atlas-runner:ro

