    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-app-role:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      script-runner:
        condition: service_started
    environment:
      # ── Tamaño máximo del cuerpo ─────────────────────────────────────────
      # El carril de identidad recibe las TRES imágenes en base64 dentro del JSON
      # —anverso, reverso y selfie—, y base64 infla un tercio: con el millón de
      # bytes de serie, un carnet legible se rechaza con «request entity too
      # large» y el veredicto sale UNAVAILABLE sin que nada diga que fue el tamaño.
      BODY_LIMIT_BYTES: '${BODY_LIMIT_BYTES:-8388608}'
      # ── Administración de templates por API ──────────────────────────────
      # Apagada de serie porque es la ÚNICA superficie que acepta plantillas del
      # exterior. Aquí se enciende para desarrollo, con clave propia: sin clave
      # el arranque aborta a propósito, para que nadie la deje abierta sin querer.
      PDF_TEMPLATE_ADMIN_ENABLED: '${PDF_TEMPLATE_ADMIN_ENABLED:-true}'
      PDF_TEMPLATE_ADMIN_KEY: '${PDF_TEMPLATE_ADMIN_KEY:-clave-de-administracion-de-desarrollo-0001}'
      # `/tmp` porque en la imagen de la API el proceso corre sin privilegios y
      # `/app` pertenece a root: escribir ahí da ENOENT/EACCES. Es EFÍMERO —un
      # reinicio se lleva lo publicado por API—, y es aceptable sólo en
      # desarrollo. El sitio durable es el volumen del servicio `pdf-worker`,
      # que sí lo tiene montado; publicar contra él es lo que corresponde en un
      # despliegue de verdad.
      PDF_CUSTOM_TEMPLATE_PATH: ${PDF_CUSTOM_TEMPLATE_PATH:-/tmp/pdf-templates}
      NODE_ENV: development
      BUILD_VERSION: ${BUILD_VERSION:-2.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-local-compose}
      PORT: 3000
      # Los trabajos de fondo viven en el servicio `worker`. Sin esto, cada réplica de API
      # los ejecutaría también y competirían por su mismo pool de conexiones. Con rol API,
      # el orquestador de trabajos ni siquiera abre su conexión de escucha: esta réplica solo
      # PRODUCE señales (pg_notify dentro de sus transacciones), nunca las consume.
      WORKER_ROLE: ${API_WORKER_ROLE:-API}
      # La siembra la hace el servicio `seed`; una réplica de API nunca siembra.
      STARTUP_SEED_ENABLED: "false"
      # Workers adicionales (ADR-0026). La API tambien los necesita, y no solo el
      # proceso worker: es ella quien publica el catalogo `/v1/workers` y quien sirve
      # los escenarios de prueba. Declararlos unicamente en `worker` dejaba los dos
      # workers anunciados como NO disponibles y los escenarios apagados, con el
      # procesado funcionando por detras: un desajuste que solo se ve ejerciendo la
