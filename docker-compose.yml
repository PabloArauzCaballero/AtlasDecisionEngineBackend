      # pulsado en bucle— agote el presupuesto del mes. Un 0 aquí BLOQUEA.
      AUDIO_TTS_RUNTIME_GENERATIONS_PER_ACTOR_DAY: ${AUDIO_TTS_RUNTIME_GENERATIONS_PER_ACTOR_DAY:-3}
      AUDIO_TTS_MONTHLY_BUDGET_UNITS: ${AUDIO_TTS_MONTHLY_BUDGET_UNITS:-10000}
      SEMANTIC_ANALYSIS_WORKER_ENABLED: ${SEMANTIC_ANALYSIS_WORKER_ENABLED:-false}
      SEMANTIC_ANALYSIS_PROVIDER: ${SEMANTIC_ANALYSIS_PROVIDER:-}
      # Reconocimiento de que el texto analizado SALE del perímetro. Su guarda en
      # `env.schema.ts` no distingue entorno —a propósito: la transferencia ocurre
      # igual en desarrollo—, así que sin este paso el worker con `openai` o
      # `litellm` no arranca dentro de compose y el fallo no menciona a Docker.
      SEMANTIC_ALLOW_INTERNATIONAL_TRANSFER: ${SEMANTIC_ALLOW_INTERNATIONAL_TRANSFER:-false}
      # Configuración del proveedor elegido. Sin estas variables, declarar
      # `SEMANTIC_ANALYSIS_PROVIDER=transformer` no basta: el adaptador cae en su
      # valor por omisión y busca el servidor en `127.0.0.1:8080`, que dentro del
      # contenedor es el contenedor mismo.
      #
      # Van SIN valor por defecto a propósito. Compose omite la variable cuando
      # no está definida, y omitirla es lo correcto: cada adaptador tiene sus
      # propios valores por omisión —un modelo de OpenAI y un codificador de
      # Hugging Face no son intercambiables— y una cadena vacía no los activa,
      # los rompe (el esquema exige longitud mínima). Definirlas en `.env` es lo
      # que las enciende.
      #
      # Clasificador de transformers:
      TRANSFORMER_BASE_URL:
      TRANSFORMER_API_KEY:
      SEMANTIC_TRANSFORMER_MODEL:
      SEMANTIC_TRANSFORMER_TIMEOUT_MS:
      SEMANTIC_TRANSFORMER_BATCH_SIZE:
      # Insistencia ante un fallo PASAJERO del servidor de embeddings (503 al
      # cargar el modelo, cola llena). Sin ella, ese tropiezo tumbaba el análisis
      # entero y la tabla del extracto lo mostraba como «No se pudo», que
      # describe un fallo de clasificación que no había ocurrido.
      SEMANTIC_TRANSFORMER_MAX_ATTEMPTS:
      SEMANTIC_TRANSFORMER_RETRY_BACKOFF_MS:
