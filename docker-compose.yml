name: atlas-decision-engine

# Every credential is read from the .env file Compose loads from this directory (see
# .env.example for the full list) and none has a default here: a password committed as a
# fallback is a password that ships. Non-secret settings keep their defaults, which mirror
# the ones declared in src/common/config/env.schema.ts.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_decision}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_decision}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - atlas_decision_pg:/var/lib/postgresql/data
    # Sin `shm_size`, Postgres en contenedor recibe 64 MiB de /dev/shm y una ordenación o un
    # hash join medianos fallan con "could not resize shared memory segment". No es ajuste
    # fino: es el mínimo para que una consulta normal no aborte.
    shm_size: 256mb
    networks: [atlas_data]
    cpus: ${POSTGRES_CPUS:-2}
    mem_limit: ${POSTGRES_MEMORY:-1g}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # `maxmemory` acotado con política noeviction: esta instancia guarda contadores de rate
    # limit y caché tenant-scoped, y desalojar una clave en silencio convertiría un límite en
    # una sugerencia. Al llegar al tope Redis rechaza escrituras y el fallo se ve.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "noeviction"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-192mb}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - atlas_decision_redis:/data
    networks: [atlas_data]
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY:-256m}
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
    networks: [atlas_data]
    command: ["migrate", "deploy"]
    restart: "no"

  # One-shot: gives the non-superuser app role (atlas_app) a login password so the api
  # service below can connect as it. RLS (migration 20260719080000_tenant_rls_and_app_role)
  # is inert for any connection made as a superuser, so the api must never use the
  # POSTGRES_USER (atlas) credential that migrate/seed use.
  bootstrap-app-role:
    build:
      context: .
      target: migrator
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    networks: [atlas_data]
    entrypoint: ["node", "scripts/set-app-db-role.mjs"]
    restart: "no"

  # One-shot: aprovisiona los roles separados de lectura y escritura (atlas_writer /
  # atlas_reader) con mínimo privilegio y verifica el resultado contra el motor.
  #
  # Es un servicio explícito y no un script montado en `docker-entrypoint-initdb.d` porque
  # aquello solo corre al CREAR el volumen: una base que ya existe —lo normal en
  # desarrollo— no lo volvería a ver nunca. Aquí es reejecutable y se ve fallar.
  #
  # Corre después de `migrate` para que los GRANT alcancen a las tablas ya creadas; los
  # privilegios predeterminados cubren las que traigan las migraciones siguientes.
  provision-db-roles:
    # Bajo perfil: `docker compose up` no lo arranca ni exige sus secretos. Se pide a mano:
    #   docker compose --profile provision run --rm provision-db-roles
    profiles: ["provision"]
    build:
      context: .
      target: migrator
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # La etapa `migrator` fija NODE_ENV=production; aquí se declara el entorno real,
      # porque el script se niega a aprovisionar roles en producción por diseño.
      NODE_ENV: development
      POSTGRES_ADMIN_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      POSTGRES_WRITER_ROLE: ${POSTGRES_WRITER_ROLE:-atlas_writer}
      POSTGRES_READER_ROLE: ${POSTGRES_READER_ROLE:-atlas_reader}
      # Sin `:?`: el script valida y explica qué falta. Un `:?` aquí haría fallar la
      # interpolación de TODO el fichero, incluso para quien no use este perfil.
      POSTGRES_WRITER_PASSWORD: ${POSTGRES_WRITER_PASSWORD:-}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-}
      POSTGRES_MANAGED_SCHEMAS: ${POSTGRES_MANAGED_SCHEMAS:-public}
      POSTGRES_OBJECT_OWNER_ROLE: ${POSTGRES_USER:-atlas}
    networks: [atlas_data]
    entrypoint: ["node", "scripts/postgres/provision-development-roles.mjs"]
    restart: "no"

  # Siembra idempotente del catálogo de arranque. Es un servicio de un solo disparo y NO un
  # perfil opcional a propósito: al pasar la siembra de arranque al rol de fondo, dejar que
  # cada proceso la intentara al bootear significaba que api y worker compitieran por el
  # mismo bloqueo consultivo en cada despliegue para hacer exactamente el mismo trabajo.
  # Como Job explícito, ocurre una vez, antes que nadie, y su fallo se ve en el acto.
  seed:
    build:
      context: .
      target: migrator
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?set MANAGEMENT_API_KEY in .env}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?set RUNTIME_API_KEY in .env}
      # Una credencial por PASO de aprobacion, con solo el rol de ese paso. Sin ellas el flujo de
      # gobierno queda sin salida en una instalacion de un solo operador: los pasos exigen
      # separacion de funciones y `bootstrap-management` es el unico principal que existe. Se
      # declaran opcionales a proposito: sin definirlas, la instalacion queda como estaba.
      APPROVER_QA_API_KEY: ${APPROVER_QA_API_KEY:-}
      APPROVER_RISK_API_KEY: ${APPROVER_RISK_API_KEY:-}
      APPROVER_COMPLIANCE_API_KEY: ${APPROVER_COMPLIANCE_API_KEY:-}
      # Quien publica no es quien escribe ni quien aprueba: el despliegue aplica su propia
      # separacion de funciones y ademas exige PLATFORM_ADMIN.
      RELEASE_MANAGER_API_KEY: ${RELEASE_MANAGER_API_KEY:-}
      BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-1}
      BOOTSTRAP_MANAGEMENT_ROLES: ${BOOTSTRAP_MANAGEMENT_ROLES:-AUDITOR,COMPLIANCE,FRAUD_ANALYST,OPERATIONS,PLATFORM_ADMIN,QA_ANALYST,RISK_ANALYST,RISK_APPROVER}
      BOOTSTRAP_RUNTIME_ROLES: ${BOOTSTRAP_RUNTIME_ROLES:-DECISION_RUNTIME}
      # Este compose es el de desarrollo: siembra también el algoritmo de demostración
      # con su versión compilada y su despliegue activo. Sin esto la base queda con
      # catálogos pero sin un solo artefacto ejecutable, y cualquier prueba responde
      # «no active deployment». No se deduce de NODE_ENV porque la imagen es la misma
      # que se despliega y lo fija en `production`.
      SEED_INCLUDE_MOCKUP: ${SEED_INCLUDE_MOCKUP:-true}
      # La siembra de demostración escribe la CADENA de auditoría y seudonimiza al
      # solicitante, y las dos cosas son el mismo HMAC que usa el motor. Tiene que ser el
      # MISMO secreto y el MISMO identificador de clave que reciben `api` y `worker`: una
      # cadena firmada con otro secreto verifica como manipulada, y un sujeto seudonimizado
      # con otro secreto no lo encuentra nunca la pantalla de solicitudes de titular.
      #
      # Sin esto la siembra no se cae —se salta la cartera y la bitácora y lo dice en el
      # registro—, que es peor: la base queda con el artefacto desplegado y las siete
      # pantallas de auditoría vacías, exactamente el estado que no se distingue de un
      # motor apagado.
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?set AUDIT_HASH_SECRET in .env (at least 32 characters)}
      AUDIT_HASH_KEY_ID: ${AUDIT_HASH_KEY_ID:-v1}
    networks: [atlas_data]
    command: ["db", "seed"]
    restart: "no"

  # Isolated sidecar that executes untrusted RESULT-node scripts (JS/Python) out of process
  # from the API. Network-less (network_mode: none), capability-dropped, read-only and
  # resource-capped; the api reaches it only through a Unix socket on a shared volume, never
  # over the network. See docs/CONFIGURABLE_OUTPUTS.md for the gVisor host setup this requires.
  script-runner:
    build:
      context: .
      target: script-runner
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Requires gVisor installed on the Docker host and registered as the `runsc` runtime
    # (docs/CONFIGURABLE_OUTPUTS.md). Only remove this on a host without gVisor for local
    # development — never in production, since runc alone is not an OS security boundary.
    runtime: runsc
    network_mode: none
    pids_limit: 64
    # 128m dejaba el sidecar al 54 % EN REPOSO: cada ejecución lanza un intérprete
    # (Node ronda los 40 MB por proceso) y con dos o tres a la vez el hijo moría por
    # memoria. El síntoma era SCRIPT_EXECUTION_FAILED intermitente —a veces pasaba,
    # a veces no— que parecía un fallo del código del usuario y no lo era.
    # Sigue acotado: el límite existe para que un script no se coma el anfitrión.
    mem_limit: ${SCRIPT_RUNNER_MEMORY:-512m}
    cpus: ${SCRIPT_RUNNER_CPUS:-1.0}
    environment:
      RUNNER_SOCKET_PATH: /var/run/atlas-runner/runner.sock
      # This image installs only the minimal `python3` package (see the script-runner stage
      # in the Dockerfile), so the interpreter name differs from the development default.
      PYTHON_EXECUTABLE: ${PYTHON_EXECUTABLE:-python3}
      # Admission control. Kept well under pids_limit (each interpreter costs several pids)
      # and matched to the cpus share: beyond these the runner answers 503
      # SCRIPT_RUNNER_BUSY, which the API treats as transient and retryable — never as a
      # decision about the request.
      RUNNER_MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-4}
      RUNNER_MAX_QUEUE: ${RUNNER_MAX_QUEUE:-64}
    volumes:
      - atlas_runner_socket:/var/run/atlas-runner
    restart: unless-stopped

  # Clasificador de transformers para el worker semántico (ADR-0026).
  #
  # Sirve UN modelo codificador —no generativo— por HTTP. El worker le pide los
  # vectores del texto y de las sondas del catálogo en una sola llamada y decide
  # con aritmética; aquí no se genera una sola palabra.
  #
  # Va en un perfil y NO arranca con `docker compose up`: quien no usa el worker
  # semántico no tiene por qué pagar la descarga del modelo. Se enciende a
  # propósito:
  #
  #   docker compose --profile transformer up -d transformer
  #
  # Vive SOLO en el plano de datos y sin publicar puerto al anfitrión: es un
  # servicio interno al que sólo llaman la API y el worker. Su volumen se declara
  # con nombre fijo para que recrear la topología no obligue a volver a descargar
  # el modelo.
  transformer:
    profiles: ["transformer"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command:
      - --model-id=${SEMANTIC_TRANSFORMER_MODEL:-intfloat/multilingual-e5-small}
      # Debe ser MAYOR O IGUAL que SEMANTIC_TRANSFORMER_BATCH_SIZE del motor: el
      # servidor rechaza el lote entero al superarlo, y el fallo llega como un
      # 413 que parece un texto demasiado largo.
      - --max-client-batch-size=${SEMANTIC_TRANSFORMER_BATCH_SIZE:-32}
    volumes:
      - atlas_transformer:/data
    environment:
      HF_HOME: /data
    networks: [atlas_data]
    # Un codificador pequeño sobre CPU resuelve un lote en cientos de
    # milisegundos, pero sin techo compite con Postgres por la máquina y lo que
    # se degrada es el resto del stack, no el análisis.
    mem_limit: ${TRANSFORMER_MEMORY:-2g}
    cpus: ${TRANSFORMER_CPUS:-2}
    restart: unless-stopped

  # Pasarela de modelos: UNA interfaz compatible con OpenAI por delante de todos
  # los proveedores. Su razón de ser no es ahorrar código —el adaptador de OpenAI
  # ya existía— sino sacar del motor dos cosas que no le corresponden: qué modelo
  # atiende cada alias y las credenciales de quien lo sirve.
  #
  # Bajo perfil, como `transformer`: sólo se levanta con
  # `docker compose --profile litellm up -d litellm`. Un despliegue que no lo use
  # no arranca un contenedor más ni pide una clave que no tiene.
  litellm:
    profiles: ["litellm"]
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    environment:
      # La credencial que el motor presenta. Es la ÚNICA compartida entre los dos.
      #
      # Se pasa en forma DESNUDA y no como `${...:?...}` a propósito: un `:?` se
      # evalúa al interpolar el fichero entero, así que un despliegue que ni
      # siquiera use este perfil vería fallar cualquier `docker compose` por una
      # variable de un servicio que no arranca. En forma desnuda la clave llega
      # del entorno o no llega, y si no llega es LiteLLM quien se niega a
      # levantar —`os.environ/LITELLM_MASTER_KEY` sin valor es un error suyo de
      # arranque—, que es donde el fallo importa y a quien le importa.
      LITELLM_MASTER_KEY:
      # Alias lógico → despliegue físico. Los nombres de modelo van aquí, nunca en
      # el entorno del motor: es lo que permite cambiar de proveedor sin desplegarlo.
      SEMANTIC_FAST_DEPLOYMENT: ${SEMANTIC_FAST_DEPLOYMENT:-gpt-4.1-mini}
      SEMANTIC_FAST_API_KEY: ${SEMANTIC_FAST_API_KEY:-}
      SEMANTIC_FAST_FALLBACK_DEPLOYMENT: ${SEMANTIC_FAST_FALLBACK_DEPLOYMENT:-gpt-4.1-mini}
      SEMANTIC_FAST_FALLBACK_API_KEY: ${SEMANTIC_FAST_FALLBACK_API_KEY:-}
      SEMANTIC_DEEP_DEPLOYMENT: ${SEMANTIC_DEEP_DEPLOYMENT:-gpt-4.1}
      SEMANTIC_DEEP_API_KEY: ${SEMANTIC_DEEP_API_KEY:-}
      SEMANTIC_EMBEDDING_DEPLOYMENT: ${SEMANTIC_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      SEMANTIC_EMBEDDING_API_KEY: ${SEMANTIC_EMBEDDING_API_KEY:-}
    # `expose`, NUNCA `ports`: quien tiene la master key puede gastar contra todos
    # los proveedores configurados. Se alcanza sólo desde esta red; para depurar,
    # `docker compose exec litellm curl localhost:4000/health/liveliness`.
    expose:
      - "4000"
    networks: [atlas_data]
    healthcheck:
      # `/health/liveliness` no consulta a los proveedores: responde si el proxy
      # está en pie. `/health` sí los llama, y usarlo aquí gastaría una petición
      # de pago cada pocos segundos.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${LITELLM_MEMORY:-1g}
    restart: unless-stopped

  # Trabajos de fondo en su propio proceso: relay del outbox, worker de corridas de prueba
  # y purga de idempotencia, todos bajo el orquestador central (src/common/jobs). Se escala
  # con `--scale worker=N` sin tocar la API — los tres reclaman su trabajo con
  # FOR UPDATE SKIP LOCKED + lease, así que N réplicas no duplican nada. La API arranca con
  # WORKER_ROLE=API y por tanto ya no los ejecuta.
  worker:
    build:
      context: .
      target: worker
    depends_on:
      # El worker EJECUTA grafos (corridas de suites), así que necesita el mismo sidecar de
      # scripts que la API. Sin él, cualquier artefacto con un nodo de script fallaba su
      # suite bloqueante y no podía entrar en gobierno: es justo lo que produce «Importar
      # código», así que esa función entera quedaba sin poder desplegarse.
      script-runner:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      bootstrap-app-role:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      # Solo en loopback: /metrics del worker se raspa desde el host, nunca desde fuera.
      - "127.0.0.1:${WORKER_HEALTH_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      WORKER_ROLE: WORKER
      WORKER_HEALTH_PORT: 3001
      BUILD_VERSION: ${BUILD_VERSION:-2.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-local-compose}
      DATABASE_URL: postgresql://atlas_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      # Separación de rutas de datos (ADR-0029). Vacía, la lectura comparte el pool de
      # escritura y nada cambia; apuntándola al rol lector se separan por credencial.
      #   DATABASE_READ_URL=postgresql://atlas_reader:<secreto>@postgres:5432/atlas_decision?schema=public
      DATABASE_READ_URL: ${DATABASE_READ_URL:-}
      DATA_READ_ROUTING_ENABLED: ${DATA_READ_ROUTING_ENABLED:-false}
      ENABLE_PRIMARY_READ_FALLBACK: ${ENABLE_PRIMARY_READ_FALLBACK:-true}
      # Un pool pequeño: la concurrencia del worker la fijan sus trabajos, no el tráfico.
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-5}
      REDIS_URL: redis://redis:6379
      # El worker no autentica peticiones, pero el esquema de entorno es el mismo proceso de
      # validación para los dos: arrancarlo sin estos valores fallaría al validar.
      AUTH_MODE: API_KEY
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?set MANAGEMENT_API_KEY in .env}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?set RUNTIME_API_KEY in .env}
      # Una credencial por PASO de aprobacion, con solo el rol de ese paso. Sin ellas el flujo de
      # gobierno queda sin salida en una instalacion de un solo operador: los pasos exigen
      # separacion de funciones y `bootstrap-management` es el unico principal que existe. Se
      # declaran opcionales a proposito: sin definirlas, la instalacion queda como estaba.
      APPROVER_QA_API_KEY: ${APPROVER_QA_API_KEY:-}
      APPROVER_RISK_API_KEY: ${APPROVER_RISK_API_KEY:-}
      APPROVER_COMPLIANCE_API_KEY: ${APPROVER_COMPLIANCE_API_KEY:-}
      # Quien publica no es quien escribe ni quien aprueba: el despliegue aplica su propia
      # separacion de funciones y ademas exige PLATFORM_ADMIN.
      RELEASE_MANAGER_API_KEY: ${RELEASE_MANAGER_API_KEY:-}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?set AUDIT_HASH_SECRET in .env (at least 32 characters)}
      AUDIT_HASH_KEY_ID: ${AUDIT_HASH_KEY_ID:-v1}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env (at least 24 characters)}
      # La siembra la hace el servicio `seed` una sola vez, antes de que arranque nadie.
      STARTUP_SEED_ENABLED: "false"
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      TEST_RUN_WORKER_ENABLED: ${TEST_RUN_WORKER_ENABLED:-true}
      RUNTIME_RETENTION_SWEEP_ENABLED: ${RUNTIME_RETENTION_SWEEP_ENABLED:-true}
      # Workers adicionales (ADR-0026). El de extractos se enciende en esta
      # topología de desarrollo porque no depende de ningún servicio externo. El
      # semántico NO: necesita credenciales de un proveedor de modelos, y
      # encenderlo sin ellas sólo encola trabajo condenado a fallar.
      BANK_STATEMENT_WORKER_ENABLED: ${BANK_STATEMENT_WORKER_ENABLED:-true}
      # El de identidad también se enciende aquí: sus proveedores son
      # SINTÉTICOS y no dependen de nada externo. El catálogo publica
      # `ocrProvider: mock` para que la pantalla no lo presente como una
      # verificación contra un proveedor real.
      IDENTITY_VERIFICATION_WORKER_ENABLED: ${IDENTITY_VERIFICATION_WORKER_ENABLED:-true}
      # Umbrales de la comparación biométrica. El esquema NO les da valor por
      # omisión a propósito: sin ellos, toda verificación termina en revisión
      # manual con `THRESHOLD_PROFILE_MISSING`. Los de aquí son de LABORATORIO
      # —calibrados contra el proveedor sintético, no contra un corpus
      # etiquetado— y el nombre del perfil lo dice, que es justo lo que un
      # despliegue real tiene que sustituir por su propia medición.
      IDENTITY_MATCH_THRESHOLD: ${IDENTITY_MATCH_THRESHOLD:-0.8824}
      IDENTITY_REVIEW_THRESHOLD: ${IDENTITY_REVIEW_THRESHOLD:-0.7789}
      IDENTITY_THRESHOLD_PROFILE_VERSION: ${IDENTITY_THRESHOLD_PROFILE_VERSION:-sintetico-60x3-fmr1e-3-fnmr1e-2}
      # El de locución se enciende con el proveedor `fake`, que sintetiza un
      # MP3 determinista sin salir a la red y sin coste. El catálogo publica
      # `provider: fake` para que la pantalla no lo presente como una voz real:
      # un audio de prueba servido creyendo que es la marca es peor que ninguno.
      # El esquema lo PROHÍBE en producción.
      AUDIO_TTS_WORKER_ENABLED: ${AUDIO_TTS_WORKER_ENABLED:-true}
      AUDIO_TTS_PROVIDER: ${AUDIO_TTS_PROVIDER:-fake}
      # Permiso aparte para generar audio nuevo: sin él el worker sólo serviría
      # caché, y en un entorno recién levantado la caché está vacía.
      AUDIO_TTS_ALLOW_RUNTIME_GENERATION: ${AUDIO_TTS_ALLOW_RUNTIME_GENERATION:-true}
      # Clave de desarrollo, publicada a propósito y sólo válida aquí: el
      # esquema exige 32 caracteres con el worker encendido fuera de las
      # pruebas, porque el texto locutado lleva dentro las variables.
      AUDIO_TTS_DATA_KEY: ${AUDIO_TTS_DATA_KEY:-desarrollo-local-audio-tts-clave-32c}
      AUDIO_STORAGE_DRIVER: ${AUDIO_STORAGE_DRIVER:-database}
      # Los tramos fijos de una plantilla se pagan una vez; una frase nueva solo
      # paga sus variables. Ver env.schema.ts para el precio de calidad que acepta.
      AUDIO_SEGMENT_CACHE_ENABLED: ${AUDIO_SEGMENT_CACHE_ENABLED:-false}
      # Credenciales del proveedor de voz. Van SIN valor por omisión a
      # propósito: si alguien pone AUDIO_TTS_PROVIDER=elevenlabs sin clave, el
      # esquema de entorno lo rechaza al arrancar en vez de fallar en cada
      # locución. La voz tampoco se hereda: elegirla es una decisión de marca.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      # El modelo y el formato se dejan vacíos para caer en AUDIO_TTS_MODEL y
      # AUDIO_TTS_DEFAULT_FORMAT; declararlos aquí los sobreescribe.
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-}
      # Con valor por omisión REAL, no vacío: el esquema exige que sea una URL
      # válida, y una cadena vacía no lo es — el motor no arrancaría.
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      # CÓMO habla la voz. Los valores por omisión son los DOCUMENTADOS por el
      # proveedor: quien no toque nada sigue oyendo lo mismo que oía cuando el
      # cuerpo no llevaba `voice_settings`. Bajar STABILITY es lo que quita la
      # lectura plana; los cuatro entran en la clave de caché, así que cambiarlos
      # regenera el audio afectado en vez de seguir sirviendo el anterior.
      ELEVENLABS_VOICE_STABILITY: ${ELEVENLABS_VOICE_STABILITY:-0.5}
      ELEVENLABS_VOICE_SIMILARITY_BOOST: ${ELEVENLABS_VOICE_SIMILARITY_BOOST:-0.75}
      ELEVENLABS_VOICE_STYLE: ${ELEVENLABS_VOICE_STYLE:-0}
      ELEVENLABS_VOICE_SPEAKER_BOOST: ${ELEVENLABS_VOICE_SPEAKER_BOOST:-true}
      # Identidad de la voz: cambiar cualquiera de estos produce audios
      # DISTINTOS y la caché deja de servir los anteriores.
      AUDIO_TTS_MODEL: ${AUDIO_TTS_MODEL:-eleven_v3}
      AUDIO_TTS_VOICE_PROFILE: ${AUDIO_TTS_VOICE_PROFILE:-brand_es_latam_v1}
      AUDIO_TTS_VOICE_VERSION: ${AUDIO_TTS_VOICE_VERSION:-1}
      AUDIO_TTS_DEFAULT_LANGUAGE: ${AUDIO_TTS_DEFAULT_LANGUAGE:-es-419}
      AUDIO_TTS_DEFAULT_FORMAT: ${AUDIO_TTS_DEFAULT_FORMAT:-mp3_44100_128}
