      LITELLM_MAX_OUTPUT_TOKENS:
      # Cuánto se le espera al codificador local antes de escalar al LLM
      # (SEMANTIC_ANALYSIS_PROVIDER=cascade).
      SEMANTIC_CASCADE_LOCAL_TIMEOUT_MS:
      WORKERS_FIXTURES_ENABLED: ${WORKERS_FIXTURES_ENABLED:-true}
      DATABASE_POOL_MAX: ${API_DATABASE_POOL_MAX:-15}
      # Connects as atlas_app (non-superuser), NOT the atlas/POSTGRES_USER role migrate and
      # seed use — RLS is inert for a superuser connection (see bootstrap-app-role above).
      DATABASE_URL: postgresql://atlas_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-atlas_decision}?schema=public
      # Separación de rutas de datos (ADR-0029). Vacía, la lectura comparte el pool de
      # escritura y nada cambia; apuntándola al rol lector se separan por credencial.
      #   DATABASE_READ_URL=postgresql://atlas_reader:<secreto>@postgres:5432/atlas_decision?schema=public
      DATABASE_READ_URL: ${DATABASE_READ_URL:-}
      DATA_READ_ROUTING_ENABLED: ${DATA_READ_ROUTING_ENABLED:-false}
      ENABLE_PRIMARY_READ_FALLBACK: ${ENABLE_PRIMARY_READ_FALLBACK:-true}
      REDIS_URL: redis://redis:6379
      # IDENTITY_HYBRID (not API_KEY): the browser portal signs in through the identity
      # provider (AtlasBackend), while runtime/management clients keep using API keys — both
      # paths must stay open on the same api service. See docs/architecture/integration-map.md.
      AUTH_MODE: ${AUTH_MODE:-IDENTITY_HYBRID}
      # AtlasBackend is a separate Compose project reachable only via the host, hence
      # host.docker.internal rather than a service name on this project's default network.
      IDENTITY_PROVIDER_URL: ${IDENTITY_PROVIDER_URL:-http://host.docker.internal:53005/api/v1}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?set MANAGEMENT_API_KEY in .env}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?set RUNTIME_API_KEY in .env}
      # Una credencial por PASO de aprobacion, con solo el rol de ese paso. Sin ellas el flujo de
      # gobierno queda sin salida en una instalacion de un solo operador: los pasos exigen
      # separacion de funciones y `bootstrap-management` es el unico principal que existe. Se
      # declaran opcionales a proposito: sin definirlas, la instalacion queda como estaba.
      APPROVER_QA_API_KEY: ${APPROVER_QA_API_KEY:-}
      APPROVER_RISK_API_KEY: ${APPROVER_RISK_API_KEY:-}
      APPROVER_COMPLIANCE_API_KEY: ${APPROVER_COMPLIANCE_API_KEY:-}
      # Quien publica no es quien escribe ni quien aprueba: el despliegue aplica su propia
      # separacion de funciones y ademas exige PLATFORM_ADMIN.
      RELEASE_MANAGER_API_KEY: ${RELEASE_MANAGER_API_KEY:-}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?set AUDIT_HASH_SECRET in .env (at least 32 characters)}
      AUDIT_HASH_KEY_ID: ${AUDIT_HASH_KEY_ID:-v1}
      AUDIT_HASH_PREVIOUS_SECRETS: ${AUDIT_HASH_PREVIOUS_SECRETS:-}
      ACCESS_AUDIT_QUEUE_MAX: ${ACCESS_AUDIT_QUEUE_MAX:-1000}
      ACCESS_AUDIT_RETRY_SECONDS: ${ACCESS_AUDIT_RETRY_SECONDS:-15}
      AUDIT_VERIFY_BATCH_SIZE: ${AUDIT_VERIFY_BATCH_SIZE:-500}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env (at least 24 characters)}
      REQUIRE_REDIS_IN_PRODUCTION: "true"
      SWAGGER_ENABLED: "true"
      # Incluye el portal en contenedor (5180) además del de desarrollo (5173): esta
      # lista valida TAMBIÉN el Origin de las rutas de sesión, así que un puerto
      # ausente impide iniciar sesión con 403 UNTRUSTED_ORIGIN.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:5173,http://localhost:5180}
      # El comprobador de sintaxis de «Importar código» invoca este binario. La imagen
      # instala `python3` (Debian no crea el alias `python`), así que sin esta línea
      # subir un algoritmo Python fallaba con `spawnSync python ENOENT`.
      PYTHON_EXECUTABLE: ${PYTHON_EXECUTABLE:-python3}
      SCRIPT_NODES_ENABLED: ${SCRIPT_NODES_ENABLED:-false}
      SCRIPT_RUNNER_MODE: SIDECAR
      SCRIPT_RUNNER_SOCKET_PATH: /var/run/atlas-runner/runner.sock
      # Cota de memoria por proceso de script (§9.3). Con RUNNER_MAX_CONCURRENCY=4 el
      # peor caso son 4 x 64 MiB, que cabe holgado en el mem_limit del sidecar. A 32 MiB
      # un intérprete Node se quedaba corto y moría a mitad de ejecución.
      SCRIPT_NODE_MAX_MEMORY_MB: ${SCRIPT_NODE_MAX_MEMORY_MB:-64}
      # Tope por ejecución de script. El valor del producto (250 ms) mide bien un script ya
      # en marcha, pero NO cubre el arranque en frío del intérprete a través del socket del
      # sidecar: la primera ejecución tras levantar un contenedor lo excedía y devolvía
      # `SCRIPT_EXECUTION_FAILED` en una corrida que a la segunda pasaba. Aquí se afloja
      # sólo para la topología en contenedor; el motor conserva su cota, muy por debajo del
      # máximo que admite el esquema de entorno.
      SCRIPT_NODE_TIMEOUT_MS: ${SCRIPT_NODE_TIMEOUT_MS:-1500}
      NESTED_TREE_MAX_DEPTH: ${NESTED_TREE_MAX_DEPTH:-5}
      NESTED_TREE_DEFAULT_TIMEOUT_MS: ${NESTED_TREE_DEFAULT_TIMEOUT_MS:-2000}
      NESTED_TREE_GRAPH_MAX_EDGES: ${NESTED_TREE_GRAPH_MAX_EDGES:-2000}
      NESTED_TREE_MAX_RETAINED_BYTES: ${NESTED_TREE_MAX_RETAINED_BYTES:-1048576}
      CODE_IMPORT_MAX_SOURCE_BYTES: ${CODE_IMPORT_MAX_SOURCE_BYTES:-131072}
      CODE_IMPORT_ANALYSIS_TIMEOUT_MS: ${CODE_IMPORT_ANALYSIS_TIMEOUT_MS:-2000}
      # Traza paso a paso mientras el motor decide. Apagada, la pantalla de ejecución
      # en vivo sólo sabe decir «deshabilitada para este ambiente». Mantiene una
      # conexión abierta por espectador, de ahí que el valor de fábrica sea `false`;
      # en este compose de desarrollo es justo lo que se quiere ver.
      LIVE_EXECUTION_STREAM_ENABLED: ${LIVE_EXECUTION_STREAM_ENABLED:-true}
      LIVE_EXECUTION_STREAM_HEARTBEAT_MS: ${LIVE_EXECUTION_STREAM_HEARTBEAT_MS:-15000}
      # Trazas. Ver el mismo bloque en el servicio `worker`: nombre de servicio propio y destino
      # por nombre de red de Docker. Levantar Jaeger: `yarn jaeger:up`.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: atlas-api
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-atlas}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 25s
    networks: [atlas_app, atlas_data]
    cpus: ${API_CPUS:-2}
    mem_limit: ${API_MEMORY:-768m}
    restart: unless-stopped
    volumes:
      - atlas_runner_socket:/var/run/atlas-runner:ro

  # Smoke de runtime contra la API viva, dentro de la red de Compose. Va en contenedor por la
  # misma razón que el portal: el resultado depende de la versión de Node que lo ejecuta y de
  # que alcance a la API por su nombre de servicio, no por un puerto publicado en el host.
  # Uso: `docker compose --profile tools run --rm smoke`
  smoke:
    profiles: ["tools"]
    build:
      context: .
      target: smoke
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:3000
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?set MANAGEMENT_API_KEY in .env}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?set RUNTIME_API_KEY in .env}
      # Una credencial por PASO de aprobacion, con solo el rol de ese paso. Sin ellas el flujo de
      # gobierno queda sin salida en una instalacion de un solo operador: los pasos exigen
      # separacion de funciones y `bootstrap-management` es el unico principal que existe. Se
      # declaran opcionales a proposito: sin definirlas, la instalacion queda como estaba.
      APPROVER_QA_API_KEY: ${APPROVER_QA_API_KEY:-}
      APPROVER_RISK_API_KEY: ${APPROVER_RISK_API_KEY:-}
      APPROVER_COMPLIANCE_API_KEY: ${APPROVER_COMPLIANCE_API_KEY:-}
      # Quien publica no es quien escribe ni quien aprueba: el despliegue aplica su propia
      # separacion de funciones y ademas exige PLATFORM_ADMIN.
      RELEASE_MANAGER_API_KEY: ${RELEASE_MANAGER_API_KEY:-}
      TENANT_ID: ${BOOTSTRAP_TENANT_ID:-1}
      DEFAULT_ENVIRONMENT: ${DEFAULT_ENVIRONMENT:-PROD}
      SMOKE_ARTIFACT_CODE: ${SMOKE_ARTIFACT_CODE:-BNPL_CREDIT_DECISION}
    # Solo el plano de aplicación: el smoke ejerce la API por HTTP y no debe poder abrir
    # una conexión a Postgres ni a Redis para "comprobar" nada por detrás.
    networks: [atlas_app]
    volumes:
      # La evidencia sale del contenedor: `smoke/last-run.json` es el artefacto que se revisa.
      - ./smoke:/app/smoke
    restart: "no"

  # Portal técnico. Va en contenedor y no con una instalación local de Python porque la
  # versión de MkDocs y de sus extensiones forma parte del resultado: otra versión produce
  # un sitio distinto del que valida CI. Perfil `docs` para que no arranque con el resto.
  docs:
    profiles: ["docs"]
    image: squidfunk/mkdocs-material:9.6.14
    working_dir: /docs
    volumes:
      - .:/docs
    # Red explícita, aunque no hable con nadie: si un servicio del proyecto NO declara red,
    # Compose le crea una `default` implícita. Esa red suelta es la que otro fichero podría
    # tomar por «la red del proyecto» — y existe o no según qué perfiles se hayan activado.
    networks: [atlas_app]
    entrypoint: ["mkdocs"]
    command: ["build", "--strict"]

  docs-serve:
    profiles: ["docs"]
    image: squidfunk/mkdocs-material:9.6.14
    working_dir: /docs
    volumes:
      - .:/docs
    ports:
      - "127.0.0.1:${DOCS_PORT:-8000}:8000"
    networks: [atlas_app]
    entrypoint: ["mkdocs"]
    command: ["serve", "--dev-addr", "0.0.0.0:8000"]

volumes:
  atlas_decision_pg:
  atlas_decision_redis:
  atlas_runner_socket:
  # Nombre fijo y no derivado del proyecto: aquí viven gigas de pesos de modelo y
  # no deben volver a descargarse porque el proyecto cambie de nombre.
  atlas_transformer:
    name: atlas-transformer

# Segmentación de red. Antes todos los servicios compartían la red `default` que Compose crea
# sola, de modo que cualquier contenedor del proyecto podía abrir una conexión a Postgres o a
# Redis. Partirla en dos planos no es un adorno: reduce lo que un contenedor comprometido
# alcanza sin pedir permiso a nadie.
#
#   atlas_app   — plano de aplicación. Lo comparten los procesos que hablan HTTP entre sí
#                 (api, worker, smoke) y es el que les da salida a Internet: el worker
#                 semántico llama a proveedores externos y la API resuelve variables remotas.
#   atlas_data  — plano de datos. Solo Postgres, Redis y los procesos que los consultan.
#                 El smoke, por ejemplo, NO está aquí: prueba la API por HTTP y no tiene
#                 ninguna razón para poder abrir una conexión a la base de datos.
#
# `script-runner` no aparece en ninguna: mantiene `network_mode: none` y se alcanza solo por
# el socket Unix del volumen compartido — sigue siendo el contenedor con menos superficie.
#
# En desarrollo `atlas_data` NO es `internal`, porque una red interna impide publicar puertos
# y `127.0.0.1:5432` es lo que permite abrir psql o un cliente gráfico desde el anfitrión.
# La superposición de producción la cierra (`internal: true`) y retira esas publicaciones.
networks:
  atlas_app:
    driver: bridge
  atlas_data:
    driver: bridge
