# Solo desarrollo local. Tres cosas que el stack necesita en una maquina de escritorio:
#
#   1. Publicar la API en todas las interfaces. `docker-compose.yml` la ata a 127.0.0.1, que un
#      contenedor de otro proyecto (AtlasBackend) no alcanza ni por host.docker.internal.
#   2. Elegir proveedor de modelo LOCAL para el analisis semantico. La fabrica de proveedores se
#      resuelve al construir el modulo, no al ejecutar el worker, asi que con el proveedor por
#      omision (`openai`) la falta de `OPENAI_API_KEY` impide arrancar la API ENTERA — y el camino
#      de decision, que es el que importa aqui, no usa analisis semantico para nada.
#   3. Apuntar el proveedor de identidad a AtlasBackend PUBLICADO. El `.env.example` trae
#      `http://localhost:3001/api/v1`, que solo sirve con AtlasBackend corriendo en el anfitrion;
#      dentro del contenedor `localhost` es el propio contenedor, la conexion se rechaza y
#      `POST /v1/session/login` responde 503 IDENTITY_PROVIDER_UNAVAILABLE. El portal de riesgo lo
#      pinta como «El servicio de identidad no esta disponible», que hace buscar el fallo en
#      AtlasBackend estando AtlasBackend sano. Para otro puerto, exportar
#      `ATLAS_DEV_IDENTITY_PROVIDER_URL`: el nombre es distinto a proposito, porque compose
#      interpola `${IDENTITY_PROVIDER_URL:-...}` contra el `.env` del proyecto y ahi ya esta la
#      direccion del anfitrion — el valor por omision de este archivo nunca se aplicaria.
#
# Nunca usar fuera de local.
services:
  api:
    ports: !override
      - "0.0.0.0:${API_PORT:-3200}:3000"
    environment:
      SEMANTIC_MODEL_PROVIDER: ${SEMANTIC_MODEL_PROVIDER:-ollama}
      IDENTITY_PROVIDER_URL: ${ATLAS_DEV_IDENTITY_PROVIDER_URL:-http://host.docker.internal:3105/api/v1}

  worker:
    environment:
      SEMANTIC_MODEL_PROVIDER: ${SEMANTIC_MODEL_PROVIDER:-ollama}
      IDENTITY_PROVIDER_URL: ${ATLAS_DEV_IDENTITY_PROVIDER_URL:-http://host.docker.internal:3105/api/v1}
