apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-decision-api
spec:
  podSelector:
    matchLabels:
      app: atlas-decision-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
