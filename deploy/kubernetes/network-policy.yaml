apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-decision-api
spec:
  podSelector:
    matchLabels:
      app: atlas-decision-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS must be allowed first: without it the pod cannot resolve the Postgres, Redis or
    # JWKS hostnames and every other egress rule below is unreachable.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
