apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-decision-migrate-RELEASE_ID
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: REGISTRY/atlas-decision-migrator:2.0.0
          args: ["migrate", "deploy"]
          envFrom:
            - secretRef:
                name: atlas-decision-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
