# Despliegue de PRUEBAS del motor de decisión en el VPS de Contabo (Ubuntu).
#
# Va aparte de `docker-compose.yml` —que describe el stack LOCAL con su Postgres, su Redis, el
# sidecar de scripts, LiteLLM y el transformador— porque en el VPS no cabe ni hace falta casi nada
# de eso. Aquí quedan tres cosas: la API, el worker y, sólo si se van a probar PDFs, el generador
# documental.
#
# ## Lo que este archivo NO trae, y por qué
#
# **PostgreSQL y Redis.** La base vive en Neon; el Redis lo pone el compose de AtlasBackend y se
# comparte por la red externa. Un segundo Redis para un motor que cabe en 256 MB sería disco y RAM
# gastados en tener dos cosas que mantener.
#
# **`script-runner`, `litellm` y `transformer`.** El sidecar de scripts sólo es tolerable bajo
# gVisor (`runsc`), que no está instalado en un VPS de Contabo; los otros dos son imágenes de varios
# gigas para un análisis semántico que un entorno de pruebas puede vivir sin él. Consecuencia que
# hay que conocer antes de reportar un fallo: los nodos de script están APAGADOS en `motor.env` y el
# análisis semántico responde «proveedor no configurado». Es lo esperado de este despliegue.
#
# ## Red compartida entre bloques
#
#   docker network create atlas_vps     # una sola vez, en el VPS
#
# Es lo que permite que este motor alcance a AtlasBackend como `http://atlas-backend:3005` sin
# publicar puertos ni usar `host.docker.internal`, que en Docker Engine sobre Linux no existe: su
# fallo (EAI_AGAIN) se lee como «el bloque está caído» y es sólo un nombre que no se resuelve.
#
# ## Cómo se levanta
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml --profile pdf up -d --build   # ~4,4 GB, ver abajo
#
# ## Con COOLIFY: se monta el `.env`, NO se convierte a variables del compose
#
# Coolify también despliega este archivo tal cual. La configuración sigue viniendo de
# `motor.env` por `env_file`, y ese archivo se le da a Coolify como **fichero montado**
# (Storages → File mount, destino `/opt/atlas/env/motor.env`) en vez de pegar sus claves una a
# una en Environment Variables.
#
# La alternativa —un ancla `x-atlas-env` con `${VARIABLE}` por clave, como en
# `AtlasBackend/docker-compose.coolify.yml`— aquí NO se toma, y la razón está medida contra el
# esquema de este repositorio: de las **156 claves** que `motor.env` define, **108 rechazan la
# cadena vacía**. `${VAR:-}` no deja una clave ausente, la deja VACÍA, y una clave opcional que
# llega vacía tumba el arranque con un mensaje que habla del campo y no de la causa. Convertir
# esto es clasificar 108 claves a mano, y cada error se cobra en un despliegue que no levanta.
#
# En AtlasBackend sí compensa —69 claves, 25 delicadas— porque a cambio sus secretos quedan
# administrables desde la interfaz. Aquí el reparto no sale.
#
# Lo que hay que saber igualmente: **lo que no esté en `motor.env` no existe dentro del
# contenedor**. El worker de identidad estuvo apagado justo por eso —
# `IDENTITY_VERIFICATION_WORKER_ENABLED` vale `false` por omisión y nadie lo había nombrado—,
# así que las verificaciones se creaban y esperaban a un trabajador que no existía.

name: atlas-motor-vps

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

x-build: &build
  image: atlas-decision:dev
  build:
    context: .
    dockerfile: Dockerfile.dev
    target: app
    cache_from: ['atlas-decision:dev']

services:
  # -------------------------------------------------------------------------------------------
  # Job ONE-SHOT: migra. Corre en cada `up` porque `prisma migrate deploy` es IDEMPOTENTE — aplica
  # sólo lo que falta, y lo aplicado consta en `_prisma_migrations`.
  #
  # **No siembra, y es deliberado.** `prisma db seed` ejecuta `ts-node --transpile-only
  # prisma/seed.ts`, y arrastrar `ts-node` obligaba a hornear el árbol de desarrollo entero en la
  # imagen. Quien siembra es `SeedingService` al arrancar el WORKER: mismo trabajo, desde código ya
  # compilado, con el MISMO cerrojo consultivo y la MISMA guarda —la marca `atlas_seed.load_log` del
  # destino, no el número de filas—. Una base que ya la tiene no se toca; una virgen se siembra. Y
  # sólo corre donde corren los trabajos de fondo, así que escalar la API no multiplica los intentos.
  #
  # Para rehacer el conjunto a propósito hace falta un árbol con `ts-node`, o sea desde tu máquina:
  #   yarn prisma:seed
  # -------------------------------------------------------------------------------------------
  migrate:
    # `init: true` sustituye al `dumb-init` que iba como ENTRYPOINT en la imagen: ahora es un
    # paquete opcional (el espejo de Debian puede no responder) y apuntar a un binario que quizá
    # no está deja el contenedor sin arrancar. Docker trae su propio init y hace lo mismo: sin él,
    # `SIGTERM` no llega a Node y el apagado ordenado no corre nunca.
    init: true
    <<: *build
    env_file: ['${ATLAS_ENV_DIR:-/opt/atlas/env}/motor.env']
    command: ['npx', 'prisma', 'migrate', 'deploy']
    networks: [atlas_vps]
    restart: 'no'

  api:
    # `init: true` sustituye al `dumb-init` que iba como ENTRYPOINT en la imagen: ahora es un
    # paquete opcional (el espejo de Debian puede no responder) y apuntar a un binario que quizá
    # no está deja el contenedor sin arrancar. Docker trae su propio init y hace lo mismo: sin él,
    # `SIGTERM` no llega a Node y el apagado ordenado no corre nunca.
    init: true
    <<: [*common, *build]
    env_file: ['${ATLAS_ENV_DIR:-/opt/atlas/env}/motor.env']
    environment:
      WORKER_ROLE: API
      PORT: '3000'
      # El planificador vive en el worker. Encenderlo también aquí duplicaría cada trabajo de fondo.
      JOB_SCHEDULER_ENABLED: 'false'
    ports:
      # Bucle local: quien llama al motor es su portal (por el proxy de Next, dentro de la red) y
      # AtlasBackend (por nombre de servicio). Publicarlo fuera no habilita nada y expone la API de
      # gestión de artefactos en una máquina con IP pública.
      - '127.0.0.1:3020:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      atlas_vps:
        aliases: [motor]
    stop_grace_period: 25s
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    # `init: true` sustituye al `dumb-init` que iba como ENTRYPOINT en la imagen: ahora es un
    # paquete opcional (el espejo de Debian puede no responder) y apuntar a un binario que quizá
    # no está deja el contenedor sin arrancar. Docker trae su propio init y hace lo mismo: sin él,
    # `SIGTERM` no llega a Node y el apagado ordenado no corre nunca.
    init: true
    <<: [*common, *build]
    env_file: ['${ATLAS_ENV_DIR:-/opt/atlas/env}/motor.env']
    environment:
      WORKER_ROLE: WORKER
      WORKER_HEALTH_PORT: '3001'
      JOB_SCHEDULER_ENABLED: 'true'
      # Pool más pequeño que el de la API: la concurrencia del worker la fija el número de trabajos,
      # no el tráfico. Y en Neon las conexiones se cuentan — dos procesos con 15 cada uno agotan el
      # cupo del proyecto y el fallo aparece en el que llegue tarde, no en el que las gastó.
      DATABASE_POOL_MAX: '5'
    ports:
      - '127.0.0.1:3021:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      atlas_vps:
        aliases: [motor-worker]
    command: ['node', 'dist/worker.js']
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # 1,25 GB y no 768 MB, y el número sale de MEDIR el worker de identidad.
          #
          # Una verificación completa carga Tesseract con el modelo del español, las cinco redes de
          # Human sobre tfjs-wasm y los búferes de sharp de tres imágenes de móvil: **712 MB de RSS
          # de pico**, medido. Con el tope en 768 MB quedaban 56 MB de margen, y con
          # `IDENTITY_WORKER_CONCURRENCY` en su valor por omisión (2) la segunda verificación
          # simultánea lo cruzaba: el contenedor moría por OOM, Docker lo reiniciaba y el síntoma
          # —«el worker se reinicia solo»— no menciona la memoria por ninguna parte.
          #
          # La concurrencia está en 1 en `motor.env`, así que esto es el margen para UNA
          # verificación más el resto de trabajos de fondo del motor. Nada de esto es una reserva:
          # el contenedor sigue usando ~200 MB mientras no haya un carnet que verificar.
          #
          # Presupuesto del VPS (8 GB + 4 GB de swap): AtlasBackend 1g+768m, motor 1g+1,25g,
          # ERP 768m, tres portales 512m = ~6,3 GB de TOPES. Caben, y los portales de Next se
          # quedan muy por debajo del suyo en reposo.
          memory: 1250m

  # -------------------------------------------------------------------------------------------
  # Generador documental (perfil `pdf`)
  #
  # Su imagen son ~4,4 GB: lleva Chromium dentro, y la base oficial de Playwright trae además
  # Firefox y WebKit que este worker no abre nunca. Borrarlos NO adelgaza la imagen —están en la
  # capa de la base y un `rm` posterior sólo escribe una anulación—, así que la única forma de tener
  # un generador más pequeño es reconstruir la base, no podarla. En un VPS con el disco contado eso
  # es la diferencia entre caber y no caber, y por eso es un perfil.
  #
  # Lo usan el portal del motor (informes de decisión) y el ERP (facturas): un solo generador, no
  # dos, porque dos serían dos maquetaciones y dos pies de página institucionales.
  # -------------------------------------------------------------------------------------------
  pdf-worker:
    <<: *common
    profiles: ['pdf']
    image: atlas-decision-pdf:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: pdf-worker
    env_file: ['${ATLAS_ENV_DIR:-/opt/atlas/env}/pdf-worker.env']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - pdf-documents:/app/var/pdf-worker
    networks:
      atlas_vps:
        aliases: [pdf-worker]
    # `/dev/shm` son 64 MiB por omisión y Chromium los agota rasterizando una hoja grande. El
    # adaptador ya pasa `--disable-dev-shm-usage` (usa /tmp), así que esto es el cinturón sobre los
    # tirantes: con ambos, ni la memoria compartida ni el disco temporal se quedan cortos.
    shm_size: '512mb'
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          # 4 carriles × ~180 MiB de pico por pestaña, más el heap de Node y el propio navegador.
          memory: 2g

networks:
  atlas_vps:
    external: true

volumes:
  pdf-documents:
