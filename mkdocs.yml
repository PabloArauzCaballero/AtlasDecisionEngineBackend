# Portal técnico del backend.
#
# Se construye SIEMPRE en contenedor (`yarn docs:build`), no con una instalación local de
# Python: la versión de MkDocs y de sus extensiones forma parte del resultado, y una máquina
# con otra versión produce un sitio distinto del que valida CI.
#
# `--strict` convierte en error cualquier enlace roto o página fuera de la navegación. Es la
# diferencia entre un portal que se puede recorrer y una carpeta de Markdown.
site_name: ATLAS Decision Platform — Backend
site_description: Documentación técnica del motor de decisión de crédito, riesgo y fraude.
site_author: Plataforma ATLAS
docs_dir: docs
site_dir: site

# Documentos que viven en `docs/` pero NO forman parte del portal.
#
# Tres familias, todas legítimas fuera de la navegación:
#   - Informes históricos fechados (auditorías, verificaciones). Su valor es ser un registro
#     del momento en que se escribieron, y enlazan a ficheros de código con rutas del
#     repositorio, que en un portal serían enlaces rotos.
#   - Documentación de herramientas de asistencia y de progreso interno.
#   - La capa propia de la bóveda de Obsidian: `vault/` (mapas de contenido y plantillas, que
#     duplicarían la navegación lateral del portal) y `.obsidian/` (su configuración).
#
# Excluirlos es preferible a reescribirlos: alterar un informe fechado destruye justamente lo
# que lo hace útil. `scripts/docs/check-doc-links.mjs` lee esta misma lista.
#
# Los patrones van ANCLADOS con `/` inicial. Sin anclar, la sintaxis estilo gitignore de
# MkDocs los aplica a cualquier nivel: `audit-*.md` llegó a excluir `modules/audit-query.md`,
# es decir, una página de módulo generada del código.
exclude_docs: |
  # MkDocs trata `README.md` como el índice de su directorio y entra en conflicto con la
  # portada `index.md`, que es la que el portal usa.
  /README.md
  /vault/
  /.obsidian/
  /audit-*.md
  /contract-extension-audit-*.md
  /verification-*.md
  /testing-report.md
  /final-implementation-report.md
  /PENDIENTES-*.md
  /IMPLEMENTATION_MATRIX.md
  /VISTAS_POR_FASES.md
  /claude/
  /progress/
  /atlas/
  # Bitácora de coordinación entre agentes que comparten este árbol de trabajo. Es una nota
  # de proceso interno, no documentación del producto: publicarla en el portal la ofrecería a
  # quien viene a entender el motor de decisiones. Estaba quedando huérfana y hacía fallar
  # `yarn docs:links`, que trata toda página fuera de la navegación como un defecto.
  /AGENT-COORDINATION.md
  /plantuml/
  /stitch-reference/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a tema oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: es

